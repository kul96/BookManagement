spring.application.name=bookManagement
#server.address=localhost
#server.port=8082

## Redis Configuration
#spring.cache.type=REDIS
#spring.redis.host=localhost
#spring.redis.port=6379
##spring.redis.password=yourpassword # If needed
#spring.redis.timeout=2000

#spring security
    # default user name for form auth = user
spring.security.user.name=admin
spring.security.user.password=admin
logging.level.org.springframework.security=DEBUG

# profile (if multiple profile are there than pick last profile property only)
spring.profiles.active[]=dev

# logging level
logging.level.org.springframework.web=debug

# h2 data base
#http://localhost:8080/h2-console/
#: H2 console available at '/h2-console'. Database available at 'jdbc:h2:mem:141cbab5-d6dd-40b8-a17c-abec78f6e90d'
# only spring.h2.console.enabled=true not optional rest of all properties of h2 is optional. spring will set up by default
# Enable H2 console (optional but useful)
spring.h2.console.enabled=true

# In-memory H2 DB config
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Spring Batch create the required tables
spring.batch.jdbc.initialize-schema=always

# Let JPA create your entity tables
spring.jpa.hibernate.ddl-auto=create-drop
    # Show SQL queries in console
spring.jpa.show-sql=true
    # Format SQL nicely
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Disable auto-starting jobs (optional)
spring.batch.job.enabled=false

#kafka setup
    # Kafka Broker Configurations
        #Specifies the Kafka broker’s address.
spring.kafka.bootstrap-servers=localhost:9092
    # topic name define
app.kafka.topic.my-topic=book-events
    # Consumer Configurations
spring.kafka.consumer.group-id= book-consumer-group1
spring.kafka.consumer.auto-offset-reset= earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
#spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
    # adding trusted package for BookDTO
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.bookManagement.dto
    # Producer config
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
#spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

#management.endpoint.beans.access=UNRESTRICTED
#management.endpoints.access.default=none
#management.endpoint.env.access=READ_ONLY
management.endpoints.web.exposure.include[]=*
